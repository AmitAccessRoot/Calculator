name: calculator
description: A powerful completely offline calculator app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Database (100% Offline)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.2
  
  # Calculator Logic Engine
  math_expressions: ^2.3.1
  
  # Responsive HD UI
  flutter_screenutil: ^5.9.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  isar_generator: ^3.1.0
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Local Assets setup strictly for offline usage
  assets:
    - assets/icons/
    
  # Local Fonts setup
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/AppFont-Regular.ttf
        - asset: assets/fonts/AppFont-Medium.ttf
          weight: 500
        - asset: assets/fonts/AppFont-Bold.ttf
          weight: 700
